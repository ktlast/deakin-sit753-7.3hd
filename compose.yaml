name: sit753
services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile.jenkins
    image: sit753-jenkins:local
    container_name: sit753-jenkins
    group_add: ["0"]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD}
      PROJECT_DIR: ${PROJECT_DIR}
      RUNTIME_DIR: ${RUNTIME_DIR}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR}:${PROJECT_DIR}
      - ${RUNTIME_DIR}/workspace:${RUNTIME_DIR}/workspace
      - ${RUNTIME_DIR}/workspace@tmp:${RUNTIME_DIR}/workspace@tmp
      - ${RUNTIME_DIR}/.local:${RUNTIME_DIR}/.local:ro
    networks: [tools]
  sonarqube:
    image: sonarqube:community
    container_name: sit753-sonarqube
    ports: ["127.0.0.1:19000:9000"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks: [tools]
networks:
  tools:
    name: sit753-tools
volumes:
  jenkins_home:
  sonar_data:
  sonar_extensions:
  sonar_logs:
